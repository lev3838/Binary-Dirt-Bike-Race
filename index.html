<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Byte Rally: Dirt Bike Vocab Race</title>
<style>
:root{--bg:#fff4e0;--ink:#2b1a0e;--card:#fffaf0;--accent:#e4572e;--ok:#2e9e4f;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d130c;--ink:#ffe9c9;--card:#2c1d12;--accent:#ff7a45}}
:root[data-theme="dark"]{--bg:#1d130c;--ink:#ffe9c9;--card:#2c1d12;--accent:#ff7a45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(22px,4vw,34px);margin:4px 0;letter-spacing:.5px}
.sub{margin:0 0 8px;font-size:14px;opacity:.8}
#wrap{position:relative;width:100%;max-width:860px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:3px solid var(--ink);background:#000}
canvas{width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,15,5,.78);padding:12px;overflow:auto}
#card{background:var(--card);color:var(--ink);border-radius:14px;padding:18px 22px;max-width:520px;width:100%;text-align:center;max-height:100%;overflow:auto}
#card h2{margin:0 0 6px;font-family:Impact,"Arial Black",sans-serif;font-size:28px}
#card p{margin:6px 0;font-size:15px;line-height:1.4}
button{font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 26px;font-size:18px;cursor:pointer;margin-top:10px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.miss{text-align:left;font-size:14px;margin:8px 0;padding-left:18px}
.hint{font-size:13px;opacity:.8;margin-top:8px;text-align:center}
</style>
</head>
<body>
<h1>Byte Rally</h1>
<p class="sub">Read the clue. Ride through the sign with the matching word.</p>
<div id="wrap">
  <canvas id="c" width="800" height="450" aria-label="Dirt bike racing game"></canvas>
  <div id="ov"><div id="card"></div></div>
</div>
<p class="hint">Move up and down with ↑ ↓ (or W / S), or tap a lane.</p>
<script>
const WORDS=[["binary","A number system using 0 and 1."],["bit","The smallest unit of computer information."],["byte","A group of eight bits."],["computer","A machine that processes information."],["computer science","The study of computers."],["digital","Information used by computers."],["electricity","Energy that powers devices."],["information","Facts or details."],["keyboard","A device used for typing."],["letter","A character used in words."],["number","A symbol showing an amount."],["off","A stopped or inactive state."],["on","A working or active state."],["one","The number 1."],["pattern","Something that repeats."],["store","To save information."],["switch","A device that turns things on or off."],["symbol","A character that represents something."],["technology","Tools and devices that solve problems."],["zero","The number 0."]];
const cv=document.getElementById("c"),ctx=cv.getContext("2d"),ov=document.getElementById("ov"),card=document.getElementById("card");
const LANES=[265,330,395],BX=170,GOAL=10,RIVAL_TIME=85;
const COLORS=["#2a7de1","#e68a00","#8e44ad"];
let state="menu",deck,qi,correct,score,streak,missed,gate,qText,fb,nextT,lane,bikeY,scroll,boost,wob,wheelie,rivalP,dust,shake,wheel,t0=0,au=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function beep(f,d,type){try{au=au||new (window.AudioContext||window.webkitAudioContext)();const o=au.createOscillator(),g=au.createGain();o.type=type||"square";o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(au.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,au.currentTime+d);o.stop(au.currentTime+d)}catch(e){}}
function menu(){state="menu";ov.style.display="flex";card.innerHTML=`<h2>Byte Rally</h2><p>Race a rival rider across the desert. A clue appears at the top. Three signs roll toward you, one in each lane. Steer into the sign with the word that matches the clue.</p><p><b>Get ${GOAL} right to cross the finish line.</b> A wrong sign slows you down, and that word comes back later.</p><p>20 words: binary, bit, byte, computer, digital, pattern, switch and more.</p><button id="go">Start engine</button>`;document.getElementById("go").onclick=start}
function start(){deck=shuf(WORDS);qi=0;correct=0;score=0;streak=0;missed={};gate=null;fb=null;lane=1;bikeY=LANES[1];scroll=0;boost=0;wob=0;wheelie=0;rivalP=0;dust=[];shake=0;wheel=0;qText="Get ready…";nextT=1.2;state="play";ov.style.display="none";beep(440,.1)}
function newQ(){if(!deck.length)deck=shuf(WORDS);const[w,d]=deck.shift();const others=shuf(WORDS.filter(x=>x[0]!==w)).slice(0,2).map(x=>x[0]);const opts=shuf([w,...others]);gate={x:880,opts,ans:opts.indexOf(w),done:false,pick:-1,w,d};qText=d;fb=null}
function resolve(){gate.done=true;gate.pick=lane;const ok=lane===gate.ans;if(ok){correct++;streak++;score+=100+20*Math.min(streak,5);boost=220;wheelie=.7;beep(660,.12);setTimeout(()=>beep(880,.15),110)}else{streak=0;wob=1;shake=.4;missed[gate.w]=gate.d;deck.push([gate.w,gate.d]);beep(140,.35,"sawtooth")}
fb={ok,text:(ok?"Nice! ":"Not quite. ")+gate.w+": "+gate.d};nextT=2.2;if(correct>=GOAL){setTimeout(finish,1100);state="finishing"}}
function finish(){state="over";const win=rivalP<100;ov.style.display="flex";const ms=Object.entries(missed);card.innerHTML=`<h2>${win?"You win! 🏁":"Rival wins this time"}</h2><p>Score: <b>${score}</b></p>`+(ms.length?`<p>Words to practice:</p><ul class="miss">${ms.map(([w,d])=>`<li><b>${w}</b>: ${d}</li>`).join("")}</ul>`:`<p>Perfect run. You knew every word!</p>`)+`<button id="go">Race again</button>`;document.getElementById("go").onclick=start;beep(win?880:200,.4)}
function setLane(i){lane=Math.max(0,Math.min(2,i))}
addEventListener("keydown",e=>{const k=e.key;if(k==="ArrowUp"||k==="w"||k==="W"){setLane(lane-1);e.preventDefault()}if(k==="ArrowDown"||k==="s"||k==="S"){setLane(lane+1);e.preventDefault()}});
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect(),y=(e.clientY-r.top)/r.height*450;let b=0;LANES.forEach((ly,i)=>{if(Math.abs(y-ly)<Math.abs(y-LANES[b]))b=i});setLane(b)});
function update(dt){if(state!=="play"&&state!=="finishing")return;
const vis=240+boost-(wob>0?140:0);scroll+=vis*dt;wheel+=vis*dt/16;boost=Math.max(0,boost-dt*160);wob=Math.max(0,wob-dt);wheelie=Math.max(0,wheelie-dt);shake=Math.max(0,shake-dt);
bikeY+=(LANES[lane]-bikeY)*Math.min(1,dt*12);
if(state==="play")rivalP+=dt*100/RIVAL_TIME;
if(Math.random()<dt*30)dust.push({x:BX-34,y:bikeY+20,vx:-60-Math.random()*60,vy:-20-Math.random()*40,l:.5});
dust.forEach(p=>{p.x+=p.vx*dt-vis*dt*.3;p.y+=p.vy*dt;p.l-=dt});dust=dust.filter(p=>p.l>0);
if(gate){gate.x-=240*dt;if(!gate.done&&gate.x<=BX+45)resolve();if(gate.x<-200)gate=null}
if(!gate&&state==="play"){nextT-=dt;if(nextT<=0)newQ()}
}
function hill(off,base,amp,f,col,sp){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,190);for(let x=0;x<=800;x+=10)ctx.lineTo(x,base-amp*Math.sin((x+scroll*sp)*f)-amp*.5*Math.sin((x+scroll*sp)*f*2.3+off));ctx.lineTo(800,190);ctx.fill()}
function drawBike(x,y,ang,wh,col){ctx.save();ctx.translate(x,y);ctx.rotate(ang);
const spin=(cx)=>{ctx.save();ctx.translate(cx,-16);ctx.rotate(wh);ctx.strokeStyle="#111";ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.stroke();ctx.lineWidth=1.5;for(let i=0;i<4;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(14,0);ctx.stroke()}ctx.restore()};
spin(-30);spin(30);
ctx.strokeStyle="#222";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-30,-16);ctx.lineTo(-8,-30);ctx.lineTo(18,-34);ctx.lineTo(30,-16);ctx.moveTo(-8,-30);ctx.lineTo(0,-14);ctx.lineTo(-30,-16);ctx.stroke();
ctx.strokeStyle="#bbb";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(18,-34);ctx.lineTo(28,-20);ctx.stroke();
ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-14,-32);ctx.lineTo(16,-40);ctx.lineTo(20,-32);ctx.lineTo(-10,-26);ctx.fill();
ctx.fillStyle="#333";ctx.fillRect(-26,-34,16,5);
ctx.strokeStyle=col;ctx.lineWidth=7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-10,-34);ctx.lineTo(2,-58);ctx.stroke();
ctx.strokeStyle="#222";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-6,-40);ctx.lineTo(6,-30);ctx.moveTo(2,-56);ctx.lineTo(18,-46);ctx.lineTo(22,-38);ctx.stroke();
ctx.fillStyle=col;ctx.beginPath();ctx.arc(8,-68,9,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.fillRect(10,-72,9,6);
ctx.restore()}
function sign(g,i){const y=LANES[i],w=176,h=44;let a=1,c=COLORS[i];if(g.done){if(i===g.ans)c="#2e9e4f";else if(i===g.pick)c="#c62828";else a=.35}
ctx.save();ctx.globalAlpha=a;ctx.fillStyle="#555";ctx.fillRect(g.x-w/2+8,y-30,6,50);ctx.fillRect(g.x+w/2-14,y-30,6,50);
ctx.fillStyle=c;ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(g.x-w/2,y-62,w,h,8);ctx.fill();ctx.stroke();
let fs=22;ctx.font=`bold ${fs}px Trebuchet MS,sans-serif`;while(ctx.measureText(g.opts[i]).width>w-16&&fs>10){fs--;ctx.font=`bold ${fs}px Trebuchet MS,sans-serif`}
ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(g.opts[i],g.x,y-40);ctx.restore()}
function wrap(txt,x,y,mw,lh){const ws=txt.split(" ");let l="",ls=[];ws.forEach(w=>{const t=l?l+" "+w:w;if(ctx.measureText(t).width>mw&&l){ls.push(l);l=w}else l=t});ls.push(l);ls.forEach((s,i)=>ctx.fillText(s,x,y+i*lh));return ls.length}
function draw(){const sx=shake>0?(Math.random()-.5)*8:0;ctx.save();ctx.translate(sx,0);
let g=ctx.createLinearGradient(0,0,0,190);g.addColorStop(0,"#4aa8f0");g.addColorStop(1,"#ffe2a8");ctx.fillStyle=g;ctx.fillRect(0,0,800,215);
ctx.fillStyle="#fff3b0";ctx.beginPath();ctx.arc(650,95,38,0,7);ctx.fill();
hill(0,170,22,.012,"#c98b52",.05);hill(2,185,14,.02,"#8a6a3a",.15);
ctx.fillStyle="#6a9a3a";ctx.fillRect(0,190,800,26);
for(let x=-((scroll*1.1)%90);x<830;x+=90){ctx.fillStyle="#6b4423";ctx.fillRect(x,192,5,22);ctx.fillRect(x-45,198,95,3)}
ctx.fillStyle="#b5763a";ctx.fillRect(0,215,800,235);
ctx.fillStyle="#a2672f";for(let i=0;i<3;i++)ctx.fillRect(0,LANES[i]-30,800,60*0+2);ctx.fillRect(0,LANES[2]+32,800,3);
ctx.fillStyle="#c68a4e";for(let i=0;i<=3;i++){const y=233+i*65;for(let x=-((scroll)%60);x<800;x+=60)ctx.fillRect(x,y,30,3)}
ctx.fillStyle="rgba(80,40,10,.35)";for(let k=0;k<14;k++){const x=((k*137-scroll*1.2)%900+900)%900-50,y=225+((k*53)%200);ctx.beginPath();ctx.ellipse(x,y,16,4,0,0,7);ctx.fill()}
if(gate)for(let i=0;i<3;i++)sign(gate,i);
ctx.fillStyle="rgba(120,80,40,.6)";dust.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l*2);ctx.beginPath();ctx.arc(p.x,p.y,6*(1-p.l)+3,0,7);ctx.fill()});ctx.globalAlpha=1;
ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(BX,bikeY+4,44,7,0,0,7);ctx.fill();
const ang=(wheelie>0?-.35*Math.min(1,wheelie*3):0)+(wob>0?Math.sin(wob*30)*.18:0);
ctx.save();ctx.translate(0,bikeY+2+(wob>0?0:Math.sin(wheel*.8)*1.2));drawBike(BX,0,ang,wheel,"#e4572e");ctx.restore();
if(boost>60){ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=2;for(let i=0;i<5;i++){const y=bikeY-50+i*14,x=BX-70-Math.random()*40;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-40,y);ctx.stroke()}}
ctx.restore();
// HUD
ctx.fillStyle="rgba(20,10,4,.85)";ctx.fillRect(0,0,800,84);
ctx.textAlign="left";ctx.textBaseline="top";ctx.fillStyle="#ffd27a";ctx.font="bold 13px Trebuchet MS,sans-serif";ctx.fillText(gate&&!gate.done?"CLUE":(fb?(fb.ok?"CORRECT":"TRY AGAIN"):"CLUE"),14,8);
ctx.font="bold 21px Trebuchet MS,sans-serif";ctx.fillStyle=fb?(fb.ok?"#7be08f":"#ff8a80"):"#fff";wrap(fb?fb.text:qText,14,26,600,26);
ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font="bold 18px Trebuchet MS,sans-serif";ctx.fillText("Score "+score,788,10);ctx.font="14px Trebuchet MS,sans-serif";ctx.fillStyle="#ffd27a";ctx.fillText("Streak "+streak+(streak>=3?" 🔥":""),788,34);
// progress
const bx=40,bw=720,by=432;ctx.fillStyle="rgba(20,10,4,.75)";ctx.fillRect(0,414,800,36);ctx.fillStyle="#fff";ctx.fillRect(bx,by,bw,4);
ctx.fillStyle="#fff";ctx.fillRect(bx+bw-3,424,3,20);ctx.textAlign="center";ctx.font="11px Trebuchet MS,sans-serif";ctx.textBaseline="middle";
const pr=Math.min(1,rivalP/100),pp=correct/GOAL;
ctx.fillStyle="#4aa8f0";ctx.beginPath();ctx.arc(bx+bw*pr,by+2,8,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.fillText("Rival",bx+bw*pr,by-12);
ctx.fillStyle="#e4572e";ctx.beginPath();ctx.arc(bx+bw*pp,by+2,8,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.fillText("You",bx+bw*pp,by+17>448?by+14:by+17);
}
let last=performance.now();function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
scroll=0;gate=null;fb=null;dust=[];lane=1;bikeY=LANES[1];boost=0;wob=0;wheelie=0;rivalP=0;shake=0;wheel=0;qText="Ready?";correct=0;score=0;streak=0;
menu();requestAnimationFrame(loop);
</script>
</body>
</html>
